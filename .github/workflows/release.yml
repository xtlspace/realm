name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v2.9.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu   # glibc
          - x86_64-unknown-linux-musl  # musl
        cpu:
          - x86-64-v2
          - x86-64-v3
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p out/${{ matrix.target }}
      - name: build cross
        uses: ./.github/actions/build/cross
        with:
          mode: cross
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
          rustflags: "-C target-cpu=${{ matrix.cpu }}"
      - name: rename binary
        run: |
          mv out/${{ matrix.target }}/realm-slim \
             out/${{ matrix.target }}/realm-slim-${{ matrix.target }}-${{ matrix.cpu }}
      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}-${{ matrix.cpu }}
          path: out/${{ matrix.target }}/realm-slim-${{ matrix.target }}-${{ matrix.cpu }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: build_assets
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: build_assets/*
